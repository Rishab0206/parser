services:
  # ==============================================================================
  # 1. Backend Web Service: banking-parser (FastAPI Python Engine)
  # ==============================================================================
  - type: web
    name: banking-parser
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "u2h_wXg-94xK8W_7D_K7Y1b6-M_d7s6y1A_z9L3m5_k="
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_PATH
        value: "./uploads"
      - key: DATABASE_URL
        value: "sqlite:///./bank_intelligence.db"

  # ==============================================================================
  # 2. Frontend Static Site: banking-parser-ui (React 18 Dashboard)
  # ==============================================================================
  - type: web
    name: banking-parser-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: banking-parser
          property: host
