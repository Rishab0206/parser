services:
  # ==========================================
  # 1. Backend FastAPI Service (Python)
  # ==========================================
  - type: web
    name: bank-statement-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "45071192004245607314794888115900"
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_PATH
        value: "./uploads"
      - key: DATABASE_URL
        value: "sqlite:///./bank_intelligence.db"

  # ==========================================
  # 2. Frontend React Dashboard (Static Site)
  # ==========================================
  - type: web
    name: bank-statement-dashboard
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bank-statement-api
          property: host

