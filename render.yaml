services:
  # ==============================================================================
  # Active Service: banking-parser (Render Production Web Service)
  # Multi-stage Containerized Banking Intelligence Engine + React Dashboard
  # ==============================================================================
  - type: web
    name: banking-parser
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: "u2h_wXg-94xK8W_7D_K7Y1b6-M_d7s6y1A_z9L3m5_k="
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_PATH
        value: "./uploads"
      - key: DATABASE_URL
        value: "sqlite:///./bank_intelligence.db"
